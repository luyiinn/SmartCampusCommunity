spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smart_campus_community
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smartcampuscommunity.pojo.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
scc:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: dewmark
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: rynn233
    user-ttl: 7200000
    user-token-name: authentication